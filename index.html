<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>사업장 점검 관리</title>
    <!-- SheetJS (엑셀 파싱 라이브러리) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: calc(12px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom)) 14px;
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.5;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1a2530;
            text-align: center;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        /* 엑셀 파일 선택 영역 */
        .file-input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-input-wrapper label {
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }

        input[type="file"] {
            font-size: 13px;
        }

        /* 점검일 입력 박스 */
        .date-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .date-section label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
        }

        input[type="date"] {
            appearance: none;
            -webkit-appearance: none;
            width: auto;
            max-width: 170px;
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background-color: #f9fafb;
            color: #111827;
            text-align: center;
        }

        /* 검색 영역 */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .search-box input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
        }

        .search-box input[type="text"]:focus {
            border-color: #2563eb;
        }

        /* 사업장 목록 나열 스타일 */
        .company-list {
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #fafafa;
            -webkit-overflow-scrolling: touch;
        }

        .company-item {
            padding: 10px 12px;
            font-size: 14px;
            border-bottom: 1px solid #edf2f7;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fff;
        }

        .company-item:last-child {
            border-bottom: none;
        }

        .company-item:active, .company-item.active {
            background-color: #eff6ff;
            color: #2563eb;
            font-weight: 600;
        }

        /* 사업장 상세정보 박스 */
        .detail-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 12px;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .detail-title {
            font-size: 16px;
            font-weight: 700;
            color: #1e3a8a;
        }

        /* 네이버 지도 버튼 */
        .btn-naver-map {
            background-color: #03cf5d;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .btn-naver-map:active {
            background-color: #02b350;
        }

        .detail-content {
            width: 100%;
            max-height: 45vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-right: 4px;
        }

        .info-row {
            display: flex;
            padding: 7px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13.5px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            width: 32%;
            font-weight: 600;
            color: #64748b;
            flex-shrink: 0;
        }

        .info-value {
            width: 68%;
            color: #0f172a;
            word-break: break-all;
        }

        /* 액션 버튼 */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }

        .btn-primary {
            background-color: #2563eb;
            color: white;
        }

        .btn-primary:active {
            background-color: #1d4ed8;
        }

        .btn-secondary {
            background-color: #64748b;
            color: white;
        }

        .btn-secondary:active {
            background-color: #475569;
        }

        .empty-msg {
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="header-title">📋 사업장 점검 관리</div>

    <!-- 1. 엑셀 파일 선택 -->
    <div class="card">
        <div class="file-input-wrapper">
            <label for="excelFile">엑셀 파일 불러오기</label>
            <input type="file" id="excelFile" accept=".xlsx, .xls">
        </div>
    </div>

    <!-- 2. 점검일 설정 -->
    <div class="card">
        <div class="date-section">
            <label for="checkDate">점검일자</label>
            <input type="date" id="checkDate">
        </div>
    </div>

    <!-- 3. 사업장 검색 및 나열 목록 -->
    <div class="card">
        <label style="font-size: 13px; font-weight: 600; color: #555; display: block; margin-bottom: 6px;">사업장 선택</label>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="사업장명 검색..." onkeyup="filterList()">
        </div>
        <div class="company-list" id="companyList">
            <div class="empty-msg">엑셀 파일을 올려주세요.</div>
        </div>
    </div>

    <!-- 4. 사업장 상세정보 -->
    <div class="detail-card">
        <div class="detail-header">
            <div class="detail-title">사업장 상세정보</div>
            <div id="mapBtnArea"></div>
        </div>
        <div class="detail-content" id="detailContent">
            <div class="empty-msg">목록에서 사업장을 선택해 주세요.</div>
        </div>
    </div>

    <!-- 5. 하단 버튼 -->
    <div class="btn-group">
        <button class="btn btn-primary" onclick="saveResult()">점검결과 저장</button>
        <button class="btn btn-secondary" onclick="resetForm()">초기화</button>
    </div>

    <script>
        let excelData = [];
        let selectedIndex = -1;

        // 오늘 날짜 세팅
        document.getElementById('checkDate').value = new Date().toISOString().substring(0, 10);

        // 엑셀 파일 읽기
        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    excelData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                    
                    if (excelData.length === 0) {
                        alert("엑셀 파일에 데이터가 없습니다.");
                        return;
                    }

                    localStorage.setItem('savedExcelData', JSON.stringify(excelData));
                    renderCompanyList(excelData);
                    alert(`총 ${excelData.length}개 사업장을 불러왔습니다.`);
                } catch (err) {
                    alert("엑셀 파일을 읽는 중 오류가 발생했습니다.");
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // 저장된 데이터 로드
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('savedExcelData');
            if (saved) {
                try {
                    excelData = JSON.parse(saved);
                    renderCompanyList(excelData);
                } catch(e) {}
            }
        });

        // 사업장 목록 나열
        function renderCompanyList(data) {
            const listContainer = document.getElementById('companyList');
            if (data.length === 0) {
                listContainer.innerHTML = '<div class="empty-msg">등록된 사업장이 없습니다.</div>';
                return;
            }

            let html = '';
            data.forEach((row, index) => {
                const name = row['사업장명'] || row['업체명'] || row['상호'] || Object.values(row)[0] || `사업장 ${index + 1}`;
                const addr = row['소재지'] || row['주소'] || row['사업장주소'] || '';
                
                html += `
                    <div class="company-item ${selectedIndex === index ? 'active' : ''}" onclick="selectCompany(${index})">
                        <div>
                            <div style="font-weight:600;">${name}</div>
                            ${addr ? `<div style="font-size:11px; color:#888;">${addr}</div>` : ''}
                        </div>
                        <span style="font-size:12px; color:#ccc;">›</span>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        // 검색 필터링
        function filterList() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = [];

            excelData.forEach((row, index) => {
                const name = String(row['사업장명'] || row['업체명'] || row['상호'] || Object.values(row)[0] || '');
                const addr = String(row['소재지'] || row['주소'] || row['사업장주소'] || '');
                
                if (name.toLowerCase().includes(keyword) || addr.toLowerCase().includes(keyword)) {
                    filtered.push({ row, originalIndex: index });
                }
            });

            const listContainer = document.getElementById('companyList');
            if (filtered.length === 0) {
                listContainer.innerHTML = '<div class="empty-msg">검색 결과가 없습니다.</div>';
                return;
            }

            let html = '';
            filtered.forEach(item => {
                const name = item.row['사업장명'] || item.row['업체명'] || item.row['상호'] || Object.values(item.row)[0] || `사업장 ${item.originalIndex + 1}`;
                const addr = item.row['소재지'] || item.row['주소'] || item.row['사업장주소'] || '';

                html += `
                    <div class="company-item ${selectedIndex === item.originalIndex ? 'active' : ''}" onclick="selectCompany(${item.originalIndex})">
                        <div>
                            <div style="font-weight:600;">${name}</div>
                            ${addr ? `<div style="font-size:11px; color:#888;">${addr}</div>` : ''}
                        </div>
                        <span style="font-size:12px; color:#ccc;">›</span>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        // 사업장 선택 및 상세정보 + 네이버 지도 연동
        function selectCompany(index) {
            selectedIndex = index;
            
            // 목록 선택 상태 업데이트
            const keyword = document.getElementById('searchInput').value;
            if (keyword) filterList(); else renderCompanyList(excelData);

            const item = excelData[index];
            const detailContainer = document.getElementById('detailContent');
            const mapBtnArea = document.getElementById('mapBtnArea');

            // 네이버 지도 검색용 정보 추출 (주소 우선, 없으면 사업장명)
            const companyName = item['사업장명'] || item['업체명'] || item['상호'] || '';
            const address = item['소재지'] || item['주소'] || item['사업장주소'] || item['소재지(도로명)'] || item['소재지(지번)'] || companyName;

            // 네이버 지도 앱 Scheme & Web URL 생성
            if (address) {
                const encodedQuery = encodeURIComponent(address);
                const appUrl = `navermaps://search?query=${encodedQuery}`;
                const webUrl = `https://m.map.naver.com/search2/search.naver?query=${encodedQuery}`;

                mapBtnArea.innerHTML = `
                    <a href="${appUrl}" onclick="openNaverMap(event, '${appUrl}', '${webUrl}')" class="btn-naver-map">
                        📍 네이버 지도
                    </a>
                `;
            } else {
                mapBtnArea.innerHTML = '';
            }

            // 상세 내용 출력
            let html = '';
            for (const [key, value] of Object.entries(item)) {
                html += `
                    <div class="info-row">
                        <div class="info-label">${key}</div>
                        <div class="info-value">${value !== "" ? value : "-"}</div>
                    </div>
                `;
            }
            detailContainer.innerHTML = html;
        }

        // 네이버 지도 열기 핸들러 (앱 없으면 웹 연결)
        function openNaverMap(event, appUrl, webUrl) {
            event.preventDefault();
            const clickedAt = +new Date();
            
            // 앱 열기 시도
            window.location.href = appUrl;

            // 앱이 안 열릴 경우 1.5초 후 웹 페이지 이동
            setTimeout(function() {
                if (+new Date() - clickedAt < 2000) {
                    window.open(webUrl, '_blank');
                }
            }, 1500);
        }

        // 저장 기능
        function saveResult() {
            if (selectedIndex === -1) {
                alert("사업장을 목록에서 선택해 주세요.");
                return;
            }

            const item = excelData[selectedIndex];
            const name = item['사업장명'] || item['업체명'] || item['상호'] || Object.values(item)[0];
            const dateVal = document.getElementById('checkDate').value;

            alert(`[점검저장 완료]\n점검일: ${dateVal}\n사업장: ${name}`);
        }

        // 초기화
        function resetForm() {
            if (confirm("저장된 데이터를 초기화하시겠습니까?")) {
                localStorage.removeItem('savedExcelData');
                excelData = [];
                selectedIndex = -1;
                document.getElementById('companyList').innerHTML = '<div class="empty-msg">데이터가 초기화되었습니다.</div>';
                document.getElementById('detailContent').innerHTML = '<div class="empty-msg">목록에서 사업장을 선택해 주세요.</div>';
                document.getElementById('mapBtnArea').innerHTML = '';
                document.getElementById('excelFile').value = '';
                document.getElementById('searchInput').value = '';
            }
        }
    </script>
</body>
</html>
