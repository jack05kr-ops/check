<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사업장 점검관리 (스마트 시트 인식)</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#222}
header{background:#222;color:#fff;padding:16px 20px}main{max-width:1200px;margin:auto;padding:18px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
button{border:0;border-radius:8px;padding:9px 12px;background:#222;color:#fff;cursor:pointer;margin:3px}
button.secondary{background:#e9ecef;color:#222}
input,select,textarea{padding:9px;border:1px solid #ccc;border-radius:8px;margin:3px}
input{max-width:100%}textarea{width:100%;min-height:70px}
#rows{max-height:430px;overflow:auto}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:14px}
.status{font-weight:bold}.muted{color:#777;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.detail-table{width:100%;border-collapse:collapse;font-size:13px}
.detail-table th{background:#f1f3f5;width:38%;text-align:left;padding:7px 8px;border-bottom:1px solid #e9ecef;color:#495057;font-weight:600}
.detail-table td{padding:7px 8px;border-bottom:1px solid #e9ecef;word-break:break-all}

@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:10px}th:nth-child(2),td:nth-child(2){display:none}}
</style>
</head>
<body>
<header><b>📍 사업장 점검관리</b></header>
<main>
<div class="card">
  <b>데이터 저장형 점검관리</b>
  <div class="muted">엑셀 내 모든 시트를 자동 탐색하여 유효한 데이터를 불러옵니다.</div>
  <input type="file" id="file" accept=".xlsx,.xls,.csv">
  <button onclick="exportData()">점검데이터 Excel 저장</button>
  <button class="secondary" onclick="clearData()">저장 데이터 초기화</button>
  <span id="msg" class="muted"></span>
</div>

<div class="grid">
<div class="card">
  <h3>사업장 목록</h3>
  <input id="search" placeholder="업소명 또는 주소 검색" style="width:100%; max-width:260px;">
  <select id="filter"><option value="">전체</option><option>미점검</option><option>적정</option><option>조치필요</option></select>
  <span id="count" class="muted"></span>
  <div id="rows"></div>
</div>

<div class="card">
  <h3>점검 및 상세정보</h3>
  <div id="detail" class="muted">사업장을 선택하세요.</div>
</div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const KEY = "inspectionDataV5";
let data = JSON.parse(localStorage.getItem(KEY) || "[]");
let selected = null;

document.getElementById("file").addEventListener("change", e => {
 const f = e.target.files[0];
 if(!f) return;
 
 const reader = new FileReader();
 reader.onload = function(evt) {
   try {
     const buffer = evt.target.result;
     const wb = XLSX.read(buffer, {type: "array"});
     
     let rows = [];
     let usedSheetName = "";

     // 모든 시트를 순회하며 실제 데이터가 들어있는 시트 탐색
     for (const sheetName of wb.SheetNames) {
       const ws = wb.Sheets[sheetName];
       const parsedRows = XLSX.utils.sheet_to_json(ws, {defval:""});
       
       // 비어있지 않은 데이터가 유의미하게 존재하는 시트 선택
       const validRows = parsedRows.filter(r => Object.values(r).some(v => String(v).trim() !== ""));
       if (validRows.length > 0) {
         rows = validRows;
         usedSheetName = sheetName;
         break;
       }
     }

     if(!rows || rows.length === 0) {
       alert("엑셀 파일 내 모든 시트에 읽을 수 있는 데이터가 없습니다.");
       return;
     }

     const incoming = rows.map((r, i) => {
       const keys = Object.keys(r);
       
       // 업소명 키워드 매핑 또는 값이 존재하는 첫번째 열 선택
       let nk = keys.find(k => /업소명|업체명|사업장명|상호|명칭/i.test(String(k)));
       if (!nk) {
         nk = keys.find(k => r[k] && String(r[k]).trim() !== "" && !/구분|순번|no/i.test(String(k))) || keys[0];
       }

       // 주소 키워드 매핑 또는 두번째 열 선택
       let ak = keys.find(k => /도로명주소|지번주소|소재지|주소|위치/i.test(String(k)));
       if (!ak && keys.length > 1) {
         ak = keys.find(k => k !== nk && r[k] && String(r[k]).trim() !== "") || keys[1];
       }

       const name = nk && r[nk] ? String(r[nk]).trim() : `사업장_${i+1}`;
       const addr = ak && r[ak] ? String(r[ak]).trim() : "";

       return {
         _id: name + "|" + addr + "|" + i,
         _name: name,
         _addr: addr,
         _status: "미점검",
         _date: "",
         _result: "",
         _memo: "",
         ...r
       };
     });

     const oldMap = new Map(data.map(x => [x._name + "|" + x._addr, x]));
     data = incoming.map(x => {
       const old = oldMap.get(x._name + "|" + x._addr);
       if(old) {
         x._status = old._status || "미점검";
         x._date = old._date || "";
         x._result = old._result || "";
         x._memo = old._memo || "";
       }
       return x;
     });

     save();
     render();
     msg(`Excel 불러오기 성공 (${usedSheetName} 시트, ${data.length}건)`);
   } catch (err) {
     alert("엑셀 읽기 실패: " + err.message);
   }
 };
 reader.readAsArrayBuffer(f);
});

document.getElementById("search").addEventListener("input", render);
document.getElementById("filter").addEventListener("change", render);

function save(){ localStorage.setItem(KEY, JSON.stringify(data)); }
function msg(t){ document.getElementById("msg").textContent = "  " + t; setTimeout(() => document.getElementById("msg").textContent = "", 2500); }

function render(){
 const q = document.getElementById("search").value.toLowerCase();
 const f = document.getElementById("filter").value;
 const arr = data.filter(x => (!q || x._name.toLowerCase().includes(q) || x._addr.toLowerCase().includes(q)) && (!f || x._status === f));
 document.getElementById("count").textContent = ` ${arr.length}개`;
 
 let html = "<table><thead><tr><th>업소명</th><th>주소</th><th>상태</th></tr></thead><tbody>";
 arr.forEach(x => {
   html += `<tr data-id="${esc(x._id)}" class="item-row" style="cursor:pointer"><td><b>${esc(x._name)}</b></td><td>${esc(x._addr)}</td><td class="status">${esc(x._status)}</td></tr>`;
 });
 html += "</tbody></table>";
 
 document.getElementById("rows").innerHTML = html;

 document.querySelectorAll(".item-row").forEach(el => {
   el.addEventListener("click", () => selectItem(el.getAttribute("data-id")));
 });
}

function selectItem(id){
 selected = data.find(x => x._id === id);
 if(!selected) return;

 let detailRows = "";
 for(const [key, val] of Object.entries(selected)) {
   if(key.startsWith("_")) continue;
   detailRows += `<tr><th>${esc(key)}</th><td>${esc(val)}</td></tr>`;
 }

 document.getElementById("detail").innerHTML = `
 <div style="margin-bottom:12px;">
   <h3 style="margin:0 0 4px 0;">${esc(selected._name)}</h3>
   <div class="muted">${esc(selected._addr)}</div>
 </div>

 <div style="background:#f8f9fa; padding:12px; border-radius:8px; margin-bottom:16px; border:1px solid #e9ecef;">
   <b>📋 점검 기록 입력</b>
   <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;">
     <label>상태<br><select id="st" style="width:100%"><option>미점검</option><option>적정</option><option>조치필요</option></select></label>
     <label>점검일<br><input type="date" id="dt" style="width:100%"></label>
   </div>
   <label style="display:block; margin-top:8px;">점검결과<br><input id="rs" placeholder="예: 현장 확인 완료" style="width:100%"></label>
   <label style="display:block; margin-top:8px;">비고<br><textarea id="mm" placeholder="점검 메모"></textarea></label>
   <div style="margin-top:10px;">
     <button onclick="saveItem()">저장</button>
     <button class="secondary" onclick="nav()">네이버지도</button>
   </div>
 </div>

 <b>📄 사업장 상세 정보</b>
 <div style="max-height:320px; overflow:auto; margin-top:8px; border:1px solid #eee; border-radius:8px;">
   <table class="detail-table">
     <tbody>${detailRows || '<tr><td class="muted">상세 정보가 없습니다.</td></tr>'}</tbody>
   </table>
 </div>`;

 document.getElementById("st").value = selected._status;
 document.getElementById("dt").value = selected._date;
 document.getElementById("rs").value = selected._result;
 document.getElementById("mm").value = selected._memo;
}

function saveItem(){
 if(!selected) return;
 selected._status = document.getElementById("st").value;
 selected._date = document.getElementById("dt").value;
 selected._result = document.getElementById("rs").value;
 selected._memo = document.getElementById("mm").value;
 save(); render(); selectItem(selected._id); msg("저장되었습니다");
}

function nav(){
 if(!selected || !selected._addr) return;
 const query = encodeURIComponent(selected._addr);
 const appName = encodeURIComponent("사업장점검");
 const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

 if(isMobile){
   const appUrl = `nmap://search?query=${query}&appname=${appName}`;
   const webUrl = `https://m.map.naver.com/search2/search.naver?query=${query}`;
   const start = Date.now();
   location.href = appUrl;
   setTimeout(()=>{
     if(Date.now() - start < 1500){
       location.href = webUrl;
     }
   }, 500);
 } else {
   window.open(`https://map.naver.com/p/search/${query}`, '_blank');
 }
}

function exportData(){
 if(!data.length){alert("저장된 데이터가 없습니다.");return}
 
 const exportList = data.map(item => {
   const row = {};
   row["점검상태"] = item._status;
   row["점검일자"] = item._date;
   row["점검결과"] = item._result;
   row["점검메모"] = item._memo;
   
   for(const [k, v] of Object.entries(item)) {
     if(!k.startsWith("_")) {
       row[k] = v;
     }
   }
   return row;
 });

 const ws = XLSX.utils.json_to_sheet(exportList);
 const wb = XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb, ws, "점검관리");
 XLSX.writeFile(wb, "사업장_점검결과데이터.xlsx");
}

function clearData(){
 if(confirm("저장된 점검관리 데이터를 모두 삭제할까요?")){
  localStorage.removeItem(KEY); data = []; selected = null; render();
  document.getElementById("detail").innerHTML = '<span class="muted">사업장을 선택하세요.</span>';
 }
}

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

render();
</script>
</body>
</html>
