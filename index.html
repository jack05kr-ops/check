<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>사업장 점검 관리</title>
    <!-- SheetJS (엑셀 파싱 라이브러리) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: calc(12px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom)) 14px;
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.5;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1a2530;
            text-align: center;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        /* 엑셀 파일 선택 영역 */
        .file-input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-input-wrapper label {
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }

        input[type="file"] {
            font-size: 13px;
        }

        /* 점검일 입력 박스 - 아이폰 크기 폭주 방지 */
        .date-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .date-section label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
        }

        input[type="date"] {
            appearance: none;
            -webkit-appearance: none;
            width: auto;
            max-width: 170px;
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background-color: #f9fafb;
            color: #111827;
            text-align: center;
        }

        /* 검색 영역 */
        .search-box {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .search-box input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
        }

        .search-box input[type="text"]:focus {
            border-color: #2563eb;
        }

        /* 사업장 목록 선택 */
        select {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background-color: #fff;
            margin-top: 8px;
        }

        /* 사업장 상세정보 박스 - 잘림 및 두 줄 고정 현상 수정 */
        .detail-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 12px;
        }

        .detail-title {
            font-size: 16px;
            font-weight: 700;
            color: #1e3a8a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .detail-content {
            width: 100%;
            max-height: 55vh; /* 화면의 55% 높이까지만 차지 */
            overflow-y: auto;  /* 두 줄로 잘리지 않고 부드러운 스크롤 제공 */
            -webkit-overflow-scrolling: touch;
            padding-right: 4px;
        }

        .info-row {
            display: flex;
            padding: 6px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13.5px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            width: 32%;
            font-weight: 600;
            color: #64748b;
            flex-shrink: 0;
        }

        .info-value {
            width: 68%;
            color: #0f172a;
            word-break: break-all;
        }

        /* 액션 버튼 */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }

        .btn-primary {
            background-color: #2563eb;
            color: white;
        }

        .btn-primary:active {
            background-color: #1d4ed8;
        }

        .btn-secondary {
            background-color: #64748b;
            color: white;
        }

        .btn-secondary:active {
            background-color: #475569;
        }

        .empty-msg {
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="header-title">📋 사업장 점검 관리</div>

    <!-- 1. 엑셀 파일 선택 -->
    <div class="card">
        <div class="file-input-wrapper">
            <label for="excelFile">엑셀 파일 불러오기</label>
            <input type="file" id="excelFile" accept=".xlsx, .xls">
        </div>
    </div>

    <!-- 2. 점검일 설정 -->
    <div class="card">
        <div class="date-section">
            <label for="checkDate">점검일자</label>
            <input type="date" id="checkDate">
        </div>
    </div>

    <!-- 3. 사업장 검색 및 선택 -->
    <div class="card">
        <label style="font-size: 13px; font-weight: 600; color: #555;">사업장 검색</label>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="사업장명 입력 후 검색" onkeyup="filterList()">
        </div>
        <select id="companySelect" onchange="displayDetail()">
            <option value="">-- 사업장을 선택하세요 --</option>
        </select>
    </div>

    <!-- 4. 사업장 상세정보 -->
    <div class="detail-card">
        <div class="detail-title">사업장 상세정보</div>
        <div class="detail-content" id="detailContent">
            <div class="empty-msg">엑셀 파일을 올린 후 사업장을 선택해 주세요.</div>
        </div>
    </div>

    <!-- 5. 저장이나 기타 버튼 영역 -->
    <div class="btn-group">
        <button class="btn btn-primary" onclick="saveResult()">점검결과 저장</button>
        <button class="btn btn-secondary" onclick="resetForm()">초기화</button>
    </div>

    <script>
        let excelData = [];

        // 오늘 날짜 기본 세팅
        document.getElementById('checkDate').value = new Date().toISOString().substring(0, 10);

        // 엑셀 파일 읽기
        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    excelData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                    
                    if (excelData.length === 0) {
                        alert("엑셀 파일에 데이터가 없습니다.");
                        return;
                    }

                    // LocalStorage 저장
                    localStorage.setItem('savedExcelData', JSON.stringify(excelData));
                    populateSelect(excelData);
                    alert(`총 ${excelData.length}개 사업장을 불러왔습니다.`);
                } catch (err) {
                    alert("엑셀 파일을 읽는 중 오류가 발생했습니다.");
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // 저장된 데이터가 있으면 로드
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('savedExcelData');
            if (saved) {
                try {
                    excelData = JSON.parse(saved);
                    populateSelect(excelData);
                } catch(e) {}
            }
        });

        // 드롭다운 채우기
        function populateSelect(data) {
            const select = document.getElementById('companySelect');
            select.innerHTML = '<option value="">-- 사업장을 선택하세요 --</option>';

            data.forEach((row, index) => {
                // 첫 번째 컬럼이나 '사업장명' 컬럼을 제목으로 사용
                const companyName = row['사업장명'] || row['업체명'] || row['상호'] || Object.values(row)[0] || `사업장 ${index + 1}`;
                const option = document.createElement('option');
                option.value = index;
                option.textContent = companyName;
                select.appendChild(option);
            });
        }

        // 검색 필터링
        function filterList() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const select = document.getElementById('companySelect');
            select.innerHTML = '<option value="">-- 사업장을 선택하세요 --</option>';

            excelData.forEach((row, index) => {
                const companyName = String(row['사업장명'] || row['업체명'] || row['상호'] || Object.values(row)[0] || '');
                if (companyName.toLowerCase().includes(keyword)) {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = companyName;
                    select.appendChild(option);
                }
            });
        }

        // 상세 정보 표시
        function displayDetail() {
            const selectIndex = document.getElementById('companySelect').value;
            const detailContainer = document.getElementById('detailContent');

            if (selectIndex === "") {
                detailContainer.innerHTML = '<div class="empty-msg">선택된 사업장이 없습니다.</div>';
                return;
            }

            const item = excelData[selectIndex];
            let html = '';

            for (const [key, value] of Object.entries(item)) {
                html += `
                    <div class="info-row">
                        <div class="info-label">${key}</div>
                        <div class="info-value">${value !== "" ? value : "-"}</div>
                    </div>
                `;
            }

            detailContainer.innerHTML = html;
        }

        // 점검 저장 예시
        function saveResult() {
            const selectIndex = document.getElementById('companySelect').value;
            const dateVal = document.getElementById('checkDate').value;

            if (selectIndex === "") {
                alert("사업장을 먼저 선택해 주세요.");
                return;
            }

            alert(`[저장 완료]\n점검일: ${dateVal}\n사업장: ${document.getElementById('companySelect').options[document.getElementById('companySelect').selectedIndex].text}`);
        }

        // 초기화
        function resetForm() {
            if (confirm("저장된 데이터를 초기화하시겠습니까?")) {
                localStorage.removeItem('savedExcelData');
                excelData = [];
                document.getElementById('companySelect').innerHTML = '<option value="">-- 사업장을 선택하세요 --</option>';
                document.getElementById('detailContent').innerHTML = '<div class="empty-msg">데이터가 초기화되었습니다.</div>';
                document.getElementById('excelFile').value = '';
                document.getElementById('searchInput').value = '';
            }
        }
    </script>
</body>
</html>
